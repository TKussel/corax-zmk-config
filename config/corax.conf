CONFIG_ZMK_KEYBOARD_NAME="Corax"

# Rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display support: neither ZMK nor the nice_view shield enable this
# automatically, so it must be set explicitly.
CONFIG_ZMK_DISPLAY=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# Power management: enter deep sleep after one hour.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_EXT_POWER=y

# Increase Bluetooth transmit power for improved range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Encoder-driven mouse scrolling
CONFIG_ZMK_POINTING=y
